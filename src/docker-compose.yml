services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: agentech-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentech}
      POSTGRES_USER: ${POSTGRES_USER:-agentech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      TZ: America/Santiago
      PGTZ: America/Santiago
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    container_name: agentech-adminer
    profiles: ["herramientas"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  pgdata:
